name: pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          # El proyecto no tiene ningun archivo llamado requirements.txt, que es
          # lo unico que la accion busca por defecto para calcular la cache.
          cache-dependency-path: |
            requirements_dev.txt
            requirements_marketplace_bot.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements_dev.txt

      - name: Correr la suite
        run: python -m pytest -q
